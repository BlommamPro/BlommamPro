name: Generate trophy card

on:
  schedule:
    - cron: "0 0 * * 0" # Se ejecuta cada domingo a medianoche
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create dist directory
        run: mkdir -p dist

      - name: Generate trophy.svg
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: ${{ github.repository_owner }}
          theme: dracula
          file: dist/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          max-rows: 1
          margin-width: 8
          margin-height: 8

      - name: Push trophy.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: trophy-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
